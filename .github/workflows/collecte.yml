name: Collecte du bulletin

# Rassemble les sources du bulletin avant la tâche de 06:35 (Paris), pour que Claude
# n'ait pas besoin de lire les sites lui-même. Trois passages (03:15, 04:15, 05:15 UTC)
# couvrent l'heure d'hiver et d'été et les retards du planificateur GitHub ; le dernier gagne.
on:
  schedule:
    - cron: "15 3,4,5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collecte.py"
      - ".github/workflows/collecte.yml"

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter les sources de la fenêtre
        run: python3 scripts/collecte.py
      - name: Publier
        run: |
          git config user.name "veille-cti-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A raw
          if git diff --cached --quiet; then echo "Rien à publier"; exit 0; fi
          git commit -m "Collecte des sources $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            sleep 10
          done
          exit 1
